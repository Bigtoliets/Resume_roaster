[project]
name = "resume-roaster-backend"
version = "0.1.0"
description = "简历诊断 Agent 平台 · 后端"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0.30",
    "asyncmy>=0.2.9",
    "aiomysql>=0.2.0",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "openai>=1.40",
    "pymilvus>=2.4.4",
    "cryptography>=42.0",
    "jinja2>=3.1",
    "pymupdf>=1.24",
    "langgraph>=0.2.20",
    "langchain-core>=0.3",
    "cachetools>=5.3",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
langfuse = ["langfuse>=3.0"]
embedding = ["FlagEmbedding>=1.2.11"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
# Prompt 与必查项清单是给人读的中文长句，不按代码行长约束
"app/scenes/resume_diagnosis/prompts.py" = ["E501"]
"app/scenes/resume_diagnosis/checklist.py" = ["E501"]
"scripts/seed_demo.py" = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--basetemp=.pytest_tmp"
